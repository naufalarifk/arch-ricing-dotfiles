# Configuration
# ~/.config/kitty/kitty.conf
font_family      Terminess Nerd Font Mono
font_size        11.0
background       #000000
foreground       #00ff41
cursor           #00ff41
selection_background #003a10

color0  #000000
color1  #ff3300
color2  #00ff41
color3  #ff6600
color4  #0066ff
color5  #cc00ff
color6  #00ccff
color7  #00cc33
color8  #8a8a8a
color9  #ff6600
color10 #39ff14
color11 #ffd700
color12 #3399ff
color13 #ff66ff
color14 #00ffff
color15 #ffffff

window_border_color #00ff41
active_border_color #ff6600
inactive_border_color #003a10
draw_minimal_borders yes
window_padding_width 4

# Animated cursor follows text
include $HOME/.config/ml4w/settings/kitty-cursor-trail.conf

# Include wallpaper colors
include colors-matugen.conf

# Include Custom Configuration
# Create the file custom.conf in ~/.config/kitty to overwrite the default configuration
include $HOME/.config/kitty/custom.conf

